name: Controllo Voli Giornaliero

on:
  schedule:
    # Nota: GitHub Actions usa l'orario UTC. 
    # 07:30 e 17:00 UTC corrispondono a 08:30 e 18:00 in Italia (durante l'ora solare CET).
    - cron: '30 7,17 * * *'
  
  # Permette di avviare lo script manualmente dalla tab "Actions" di GitHub in qualsiasi momento
  workflow_dispatch:

jobs:
  check-flights:
    runs-on: ubuntu-latest
    
    steps:
      # 1. Scarica il codice del tuo repository
      - name: Checkout del codice
        uses: actions/checkout@v4

      # 2. Configura l'ambiente Python
      - name: Imposta Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      # 3. Installa le dipendenze necessarie
      - name: Installa dipendenze
        run: |
          python -m pip install --upgrade pip
          pip install requests pandas

      # 4. Esegue lo script di controllo dei voli passando le chiavi in sicurezza
      - name: Esegui Bot Voli
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
        run: python bot_scheduler.py
