name: Controllo Voli Giornaliero

on:
  schedule:
    # GitHub Actions usa l'orario UTC.
    # Una volta al giorno: 07:30 UTC = 08:30 in Italia con ora solare (CET), 09:30 con ora legale.
    - cron: '30 7 * * *'

  # Avvio manuale dalla tab "Actions"
  workflow_dispatch:

# Serve per salvare i file di stato (offerte notificate, ultimi risultati, quota) nel repository
permissions:
  contents: write

# Evita due esecuzioni sovrapposte che si pesterebbero i file di stato
concurrency:
  group: check-flights
  cancel-in-progress: false

jobs:
  check-flights:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del codice
        uses: actions/checkout@v4

      - name: Imposta Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Installa dipendenze
        run: python -m pip install requests

      - name: Esegui Bot Voli
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
          # Modifica questi valori per cambiare il comportamento del bot
          BUDGET_MAX: '160'
          DURATA_MAX_ORE: '2.5'
          MESI_AVANTI: '4'
          MAX_CHIAMATE: '4'
          # tutte | weekend | ponti
          TIPO_VIAGGIO: 'tutte'
          # Tetto mensile di ricerche SerpAPI (il piano gratuito ne ha 250)
          LIMITE_MENSILE: '230'
        run: python bot_scheduler.py

      - name: Salva i file di stato
        if: always()
        run: |
          for f in stato_notifiche.json ultimi_risultati.json quota_serpapi.json; do
            if [ -f "$f" ]; then git add "$f"; fi
          done
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Aggiorna risultati e stato del bot [skip ci]"
            git pull --rebase origin "${GITHUB_REF_NAME}" && git push
          fi
